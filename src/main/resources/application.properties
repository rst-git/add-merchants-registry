# ===============================================
# Configurações Gerais da Aplicação
# ===============================================
spring.application.name=add-merchants-registry
server.port=8080

# Perfil ativo padrão: 'h2' (desenvolvimento e testes locais)
# Para alternar para Oracle, altere para 'oracle' ou defina a variável SPRING_PROFILES_ACTIVE=oracle
spring.profiles.active=h2

# Configurações globais JPA
spring.jpa.open-in-view=false
